<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join HomeHarvest — Community Registration</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script>
  <script src="js/navbar.js" defer></script>
</head>
<body>
  <header class="navbar"></header>

  <main class="section">
    <div class="form-container">
      <div class="form-header">
        <span style="font-size:36px;">🛒</span>
        <h1>Join HomeHarvest</h1>
        <p style="color:var(--text-muted); font-size:14px;">Connect with your hyperlocal community marketplace.</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="role">I want to join as</label>
          <select id="role" class="form-control" required>
            <option value="customer">Customer — Browse & Order Fresh Vegetables</option>
            <option value="grower">Home Grower — Sell Harvest from My Garden</option>
            <option value="delivery">Delivery Partner — Deliver Harvests in My Area</option>
          </select>
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Priya Sharma" required minlength="2" maxlength="80">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. priya@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password (minimum 8 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" maxlength="20">
        </div>

        <div class="form-group">
          <label for="neighborhood">Neighborhood / Locality</label>
          <input type="text" id="neighborhood" class="form-control" placeholder="e.g. Indiranagar, Koramangala" required maxlength="100">
          <div class="form-helper">Used to connect you with gardens and deliveries within your local area.</div>
        </div>

        <div class="form-group">
          <label for="address">Delivery / Garden Address</label>
          <textarea id="address" class="form-control" placeholder="Complete street address or house number"></textarea>
        </div>

        <!-- Extra grower fields shown when role is grower -->
        <div id="growerExtraFields" style="display:none; background:var(--cream); padding:16px; border-radius:12px; margin-bottom:18px; border:1px solid var(--border);">
          <div class="form-group">
            <label for="gardenName">Garden / Terrace Name</label>
            <input type="text" id="gardenName" class="form-control" placeholder="e.g. Priya's Terrace Greens">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="gardenDescription">Tell us about your home garden</label>
            <textarea id="gardenDescription" class="form-control" placeholder="What vegetables do you nurture? Do you use organic compost?"></textarea>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width:100%; margin-top:10px;">
          Create My Account
        </button>

        <p style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:20px;">
          Already have an account? <a href="/login.html" style="color:var(--primary); font-weight:700;">Sign in here</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="footer"></footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get("role");
      if (roleParam && ["customer", "grower", "delivery"].includes(roleParam)) {
        document.getElementById("role").value = roleParam;
      }

      handleRoleChange();
      document.getElementById("role").addEventListener("change", handleRoleChange);

      document.getElementById("registerForm").addEventListener("submit", async e => {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating Account...";

        const payload = {
          role: document.getElementById("role").value,
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          phone: document.getElementById("phone").value.trim(),
          neighborhood: document.getElementById("neighborhood").value.trim(),
          address: document.getElementById("address").value.trim(),
          gardenName: document.getElementById("gardenName")?.value.trim(),
          gardenDescription: document.getElementById("gardenDescription")?.value.trim()
        };

        try {
          const res = await API.post("/api/auth/register", payload);
          saveSession(res);
          showToast("Welcome to HomeHarvest!", "success");
          setTimeout(() => { location.href = "/dashboard.html"; }, 800);
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create My Account";
        }
      });
    });

    function handleRoleChange() {
      const role = document.getElementById("role").value;
      const growerFields = document.getElementById("growerExtraFields");
      if (growerFields) {
        growerFields.style.display = role === "grower" ? "block" : "none";
      }
    }
  </script>
</body>
</html>
