<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — HomeHarvest</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script>
  <script src="js/navbar.js" defer></script>
</head>
<body>
  <header class="navbar"></header>

  <main class="section">
    <div class="form-container" style="max-width:580px;">
      <div class="form-header" style="text-align:left;">
        <span style="font-size:32px;">🪴</span>
        <h1 style="font-size:28px;">Account Profile</h1>
        <p style="color:var(--text-muted); font-size:14px;">Manage your contact details and default neighborhood location.</p>
      </div>

      <form id="profileForm">
        <div class="form-group">
          <label>Account Role</label>
          <input type="text" id="userRole" class="form-control" disabled style="background:#eef2ed; text-transform:capitalize;">
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required maxlength="80">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" disabled style="background:#eef2ed;">
          <div class="form-helper">Email cannot be changed directly.</div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" maxlength="20">
        </div>

        <div class="form-group">
          <label for="neighborhood">Neighborhood / Locality</label>
          <input type="text" id="neighborhood" class="form-control" maxlength="100">
        </div>

        <div class="form-group">
          <label for="address">Delivery / Contact Address</label>
          <textarea id="address" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="bio">Bio / About Me</label>
          <textarea id="bio" class="form-control" rows="2" placeholder="A little about your gardening or fresh produce interests..."></textarea>
        </div>

        <button type="submit" id="saveProfileBtn" class="btn btn-primary btn-lg" style="width:100%; margin-top:10px;">
          Save Profile Changes
        </button>
      </form>
    </div>
  </main>

  <footer class="footer"></footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const user = currentUser();
      if (!user) {
        location.href = "/login.html";
        return;
      }

      document.getElementById("userRole").value = user.role || "customer";
      document.getElementById("name").value = user.name || "";
      document.getElementById("email").value = user.email || "";
      document.getElementById("phone").value = user.phone || "";
      document.getElementById("neighborhood").value = user.neighborhood || "";
      document.getElementById("address").value = user.address || "";
      document.getElementById("bio").value = user.bio || "";

      document.getElementById("profileForm").addEventListener("submit", async e => {
        e.preventDefault();
        const btn = document.getElementById("saveProfileBtn");
        btn.disabled = true;

        const payload = {
          name: document.getElementById("name").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          neighborhood: document.getElementById("neighborhood").value.trim(),
          address: document.getElementById("address").value.trim(),
          bio: document.getElementById("bio").value.trim()
        };

        try {
          const res = await API.patch("/api/auth/profile", payload);
          saveSession({ user: res.user });
          showToast("Profile updated successfully!", "success");
          btn.disabled = false;
        } catch (err) {
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
